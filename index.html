<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Poppins", sans-serif;
}

body{
  background:#0b7fc4;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:90%;
  max-width:420px;
  background:linear-gradient(180deg,#1da1e2,#0b7fc4);
  border-radius:20px;
  padding:24px;
  color:#fff;
}

/* Badge */
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.15);
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  margin-bottom:16px;
}

/* Heading */
h1{
  font-size:24px;
  margin-bottom:10px;
}

p{
  font-size:14px;
  opacity:0.9;
  margin-bottom:20px;
}

/* Cards */
.card{
  display:flex;
  align-items:center;
  gap:14px;
  background:rgba(255,255,255,0.15);
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
}

.icon-box{
  width:48px;
  height:48px;
  background:#fff;
  color:#0b7fc4;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  font-size:20px;
}

.card h4{
  font-size:12px;
  opacity:0.8;
}

.card span{
  font-size:14px;
  font-weight:500;
}

/* Stats */
.stats{
  display:flex;
  justify-content:space-between;
  margin:20px 0;
  text-align:center;
}

.stats div{
  background:rgba(255,255,255,0.15);
  padding:12px;
  border-radius:12px;
  width:30%;
}

.stats h2{
  font-size:22px;
}

.stats p{
  font-size:11px;
  margin:0;
}

/* Social Icons */
.social{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
}

.social i{
  width:36px;
  height:36px;
  background:rgba(255,255,255,0.2);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:0.3s;
}

.social i:hover{
  background:#fff;
  color:#0b7fc4;
}
    </style>
</head>
<body>
