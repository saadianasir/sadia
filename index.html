<!DOCTYPE html>

<h1>JavaScript Assignment</h1>

<script>

/* =========================
1. Arithmetic Operators
========================= */

// 1. Total price of items in cart
let item1 = 20;
let item2 = 35;
let item3 = 15;
let totalPrice = item1 + item2 + item3;
document.write("1. Total Cart Price: $" + totalPrice + "<br><br>");


// 2. Discounted price (10%)
let price = 100;
let discount = price * 0.10;
let finalPrice = price - discount;
document.write("2. Price after 10% discount: $" + finalPrice + "<br><br>");


// 3. Total bill including 18% tax
let bill = 200;
let tax = bill * 0.18;
let totalBill = bill + tax;
document.write("3. Total Bill with 18% tax: $" + totalBill + "<br><br>");


// 4. BMI Calculator
let weight = 65; 
let height = 1.7;
let bmi = weight / (height ** 2);
document.write("4. BMI: " + bmi.toFixed(2) + "<br><br>");


// 5. Monthly salary after tax deduction
let salary = 3000;
let salaryTax = salary * 0.15;
let netSalary = salary - salaryTax;
document.write("5. Salary after tax: $" + netSalary + "<br><br>");


// 6. Average rating from 5 users
let r1 = 4, r2 = 5, r3 = 3, r4 = 4, r5 = 5;
let averageRating = (r1 + r2 + r3 + r4 + r5) / 5;
document.write("6. Average Rating: " + averageRating + "<br><br>");


// 7. Delivery charge calculator
let orderAmount = 60;
let deliveryCharge = 0;

if(orderAmount < 50){
deliveryCharge = 10;
}else{
deliveryCharge = 0;
}

document.write("7. Delivery Charge: $" + deliveryCharge + "<br><br>");


// 8. Simple Interest Calculator
let principal = 1000;
let rate = 5;
let time = 2;

let simpleInterest = (principal * rate * time) / 100;
document.write("8. Simple Interest: $" + simpleInterest + "<br><br>");


// 9. Remaining balance after withdrawal
let balance = 500;
let withdraw = 150;
let remaining = balance - withdraw;

document.write("9. Remaining Balance: $" + remaining + "<br><br>");


// 10. Minutes to hours converter
let minutes = 130;
let hours = Math.floor(minutes / 60);
let remainingMinutes = minutes % 60;

document.write("10. Time: " + hours + " hours " + remainingMinutes + " minutes<br><br>");



/* =========================
3. If-Else Statements
========================= */

let password = "1234";

}else{

}

document.write("Access Allowed<br><br>");

let discountRate = 0;

discountRate = 0.20;
}else if(order > 100){
discountRate = 0.10;
}else{
discountRate = 0;
}

let discountAmount = order * discountRate;
let finalOrderPrice = order - discountAmount;

document.write("Final Price after Discount: $" + finalOrderPrice + "<br><br>");

let marks = 75;

document.write("Grade: A<br><br>");
}else if(marks >= 60){
document.write("Grade: B<br><br>");
}else if(marks >= 40){
document.write("Grade: C<br><br>");
}else{
document.write("Fail<br><br>");
}

document.write("Weather: Very Hot - Stay Hydrated<br><br>");
}else if(temperature > 20){
document.write("Weather: Pleasant<br><br>");
}else{
document.write("Weather: Cold - Wear Warm Clothes<br><br>");
}

</script>
