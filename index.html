<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0a1f 0%, #2d1b3d 50%, #1a0a1f 100%);
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating lanterns background */
        .lantern {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 1;
        }

        .lantern:hover {
            transform: scale(1.3);
            opacity: 1;
        }

        .lantern:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; color: #ff6b6b; }
        .lantern:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; color: #ffd93d; }
        .lantern:nth-child(3) { top: 60%; left: 5%; animation-delay: 2s; color: #ff6b6b; }
        .lantern:nth-child(4) { top: 70%; right: 10%; animation-delay: 3s; color: #ffd93d; }
        .lantern:nth-child(5) { top: 40%; left: 8%; animation-delay: 4s; color: #ff6b6b; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Main card container */
        .card-container {
            perspective: 1000px;
            z-index: 10;
        }

        .card {
            width: 400px;
            min-height: 550px;
            background: linear-gradient(145deg, #4a1942 0%, #2d1142 50%, #1a0a2e 100%);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(186, 85, 211, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card:hover {
            transform: translateY(-10px) rotateX(5deg);
            box-shadow: 
                0 35px 60px rgba(0, 0, 0, 0.6),
                0 0 150px rgba(186, 85, 211, 0.4);
        }

        /* Decorative elements */
        .card-decoration {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.8;
        }

        .card-decoration.top-left { top: 15px; left: 15px; color: #ffd700; }
        .card-decoration.top-right { top: 15px; right: 15px; color: #ffd700; }
        .card-decoration.bottom-left { bottom: 15px; left: 15px; color: #ffd700; }
        .card-decoration.bottom-right { bottom: 15px; right: 15px; color: #ffd700; }

        /* Crescent moon */
        .crescent-moon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            position: relative;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .crescent-moon::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
        }

        .crescent-moon::after {
            content: '';
            position: absolute;
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #4a1942, #2d1142);
            border-radius: 50%;
            top: 5px;
            left: 15px;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
            to { filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.8)); }
        }

        /* Heading */
        .eid-text {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: #ffd700;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .sub-heading {
            font-size: 1.2rem;
            color: #e0c0e0;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }

        /* Message */
        .message {
            color: #d4c4d4;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Stars decoration */
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .star {
            color: #ffd700;
            font-size: 1.5rem;
            animation: twinkle 1.5s ease-in-out infinite;
        }

        .star:nth-child(1) { animation-delay: 0s; }
        .star:nth-child(2) { animation-delay: 0.3s; }
        .star:nth-child(3) { animation-delay: 0.6s; }
        .star:nth-child(4) { animation-delay: 0.9s; }
        .star:nth-child(5) { animation-delay: 1.2s; }

        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Button */
        .wishes-btn {
            background: linear-gradient(135deg, #8b2252 0%, #6b1a40 100%);
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .wishes-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .wishes-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(139, 34, 82, 0.5);
        }

        .wishes-btn:hover::before {
            left: 100%;
        }

        /* Confetti container */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
        }

        /* Name input area */
        .name-input {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
        }

        .name-input input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 20px;
            border-radius: 25px;
            color: #fff;
            font-size: 1rem;
            width: 200px;
            text-align: center;
            font-family: 'Playfair Display', serif;
            transition: all 0.3s ease;
        }

        .name-input input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .name-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Footer text */
        .footer-text {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <!-- Floating lanterns -->
    <div class="lantern">🏮</div>
    <div class="lantern">🏮</div>
    <div class="lantern">🏮</div>
    <div class="lantern">🏮</div>
    <div class="lantern">🏮</div>

    <!-- Main card -->
    <div class="card-container">
        <div class="card">
            <span class="card-decoration top-left">✦</span>
            <span class="card-decoration top-right">✦</span>
            <span class="card-decoration bottom-left">✦</span>
            <span class="card-decoration bottom-right">✦</span>

            <div class="crescent-moon"></div>
            
            <h1 class="eid-text">عيد مبارك</h1>
            <p class="sub-heading">EID MUBARAK</p>
            
            <div class="stars">
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
            </div>

            <p class="message">
                May this special day bring you joy, peace, and prosperity. 
                May Allah bless you with happiness and success in all your endeavors.
            </p>

            <button class="wishes-btn" id="wishesBtn">Send Wishes ✨</button>

            <div class="name-input">
                <input type="text" id="nameInput" placeholder="Your Name">
            </div>

            <p class="footer-text">With love and warm wishes</p>
        </div>
    </div>

    <!-- Confetti container -->
    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        // Confetti colors - unique palette
        const confettiColors = [
            '#ffd700', // Gold
            '#ff6b6b', // Coral red
            '#c084fc', // Purple
            '#67e8f9', // Cyan
            '#fbbf24', // Amber
            '#f472b6', // Pink
        ];

        // Create confetti piece
        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            
            // Random properties
            const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
            const size = Math.random() * 10 + 5;
            const left = Math.random() * 100;
            const animationDuration = Math.random() * 3 + 2;
            const delay = Math.random() * 0.5;
            
            // Random shape
            const shapes = ['50%', '0%', '30% 70% 70% 30% / 30% 30% 70% 70%'];
            const borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
            
            confetti.style.cssText = `
                left: ${left}%;
                width: ${size}px;
                height: ${size}px;
                background: ${color};
                border-radius: ${borderRadius};
                animation: confettiFall ${animationDuration}s ease-out ${delay}s forwards;
            `;
            
            return confetti;
        }

        // Add confetti animation keyframes
        const style = document.createElement('style');
        style.textContent = `
            @keyframes confettiFall {
                0% {
                    opacity: 1;
                    top: -10%;
                    transform: translateX(0) rotate(0deg);
                }
                100% {
                    opacity: 0;
                    top: 100%;
                    transform: translateX(${Math.random() > 0.5 ? '' : '-'}${Math.random() * 200}px) rotate(${Math.random() * 720 - 360}deg);
                }
            }
        `;
        document.head.appendChild(style);

        // Launch confetti
        function launchConfetti() {
            const container = document.getElementById('confettiContainer');
            const numberOfPieces = 100;
            
            for (let i = 0; i < numberOfPieces; i++) {
                setTimeout(() => {
                    container.appendChild(createConfetti());
                }, i * 10);
            }

            // Clean up confetti after animation
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Button click handler
        const wishesBtn = document.getElementById('wishesBtn');
        wishesBtn.addEventListener('click', function() {
            const name = document.getElementById('nameInput').value;
            
            // Add celebration animation to button
            this.innerHTML = '🎉 Happy Eid! 🎉';
            this.style.background = 'linear-gradient(135deg, #ffd700 0%, #ff8c00 100%)';
            this.style.color = '#4a1942';
            
            // Launch confetti
            launchConfetti();
            
            // Reset button after 3 seconds
            setTimeout(() => {
                this.innerHTML = 'Send Wishes ✨';
                this.style.background = 'linear-gradient(135deg, #8b2252 0%, #6b1a40 100%)';
                this.style.color = '#ffd700';
            }, 3000);
        });

        // Add interactive tilt effect to card
        const card = document.querySelector('.card');
        const cardContainer = document.querySelector('.card-container');

        cardContainer.addEventListener('mousemove', function(e) {
            const rect = cardContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-10px)`;
        });

        cardContainer.addEventListener('mouseleave', function() {
            card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0)';
        });

        // Add keyboard support for accessibility
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement.id === 'nameInput') {
                wishesBtn.click();
            }
        });

        // Welcome animation on page load
        window.addEventListener('load', function() {
            card.style.opacity = '0';
            card.style.transform = 'scale(0.8) translateY(50px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                card.style.opacity = '1';
                card.style.transform = 'scale(1) translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
