<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: gray;
            padding: 30px;
        }

        .container {
            background-color: white;
            padding: 30px;
        }

        .grid {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));

        }

        .card {
            height: 140px;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s ease;
        
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            transition: background 0.3s ease;
        
        }

        .card span {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            z-index: 1;
        }

        .card:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }

        .card:hover::before {
            background: rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>
