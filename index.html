
<!DOCTYPE html>
<html>
<head>
<title>Grocery Bill Calculator</title>
</head>

<body>

<h2>Grocery Bill Calculator</h2>

<script>

function calculateBill(){

let items = prompt("Enter number of items");
let total = 0;

for(let i=1; i<=items; i++){

let price = prompt("Enter price of item " + i);
total = total + Number(price);

}

if(total > 5000){
total = total - (total * 0.10);
}

document.write("Final Bill = " + total);

}

calculateBill();

</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
<title>Student Result</title>
</head>

<body>

<h2>Student Result System</h2>

<script>

function calculateGrade(avg){

if(avg >= 80){
return "A";
}
else if(avg >= 60){
return "B";
}
else if(avg >= 40){
return "C";
}
else{
return "Fail";
}

}

let name = prompt("Enter student name");
let total = 0;

for(let i=1; i<=5; i++){

let marks = prompt("Enter marks of subject " + i);
total = total + Number(marks);

}

let average = total / 5;
let grade = calculateGrade(average);

document.write("Name: " + name + "<br>");
document.write("Total: " + total + "<br>");
document.write("Average: " + average + "<br>");
document.write("Grade: " + grade);

</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
<title>ATM System</title>
</head>

<body>

<h2>ATM Withdrawal System</h2>

<script>

let balance = 10000;

function withdrawMoney(amount){

if(amount > balance){
return "Insufficient Balance";
}
else{
balance = balance - amount;
return "Remaining Balance = " + balance;
}

}

for(let i=1; i<=3; i++){

let amount = prompt("Enter amount to withdraw");
let result = withdrawMoney(Number(amount));

document.write(result + "<br>");

}

</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
<title>Restaurant Order</title>
</head>

<body>

<h2>Restaurant Order System</h2>

<script>

let burger = 500;
let pizza = 1200;
let drink = 200;

function calculateOrder(item, qty){

let total = 0;

if(item == "burger"){
total = burger * qty;
}

else if(item == "pizza"){
total = pizza * qty;
}

else if(item == "drink"){
total = drink * qty;
}

if(total > 2000){
total = total - (total * 0.15);
}

return total;

}

let item = prompt("Enter item (burger/pizza/drink)");
let qty = prompt("Enter quantity");

let bill = calculateOrder(item, Number(qty));

document.write("Final Bill = " + bill);

</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
<title>Salary Calculator</title>
</head>

<body>

<h2>Employee Salary Calculator</h2>

<script>

let rate = 500;

function calculateSalary(hours){

if(hours > 40){

let overtime = hours - 40;
return (40 * rate) + (overtime * rate * 1.5);

}

else{

return hours * rate;

}

}

for(let i=1; i<=3; i++){

let name = prompt("Enter employee name");
let hours = prompt("Enter hours worked");

let salary = calculateSalary(Number(hours));

document.write("Employee: " + name + "<br>");
document.write("Salary: " + salary + "<br><br>");

}

</script>

</body>
</html>
