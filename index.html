<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #a1c4fd 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .live-clock {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 25px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .live-clock .time {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
        }

        .live-clock .date {
            font-size: 0.75rem;
            color: #f0f0ff;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
            backdrop-filter: blur(4px);
        }

        .card h2 {
            color: #6c5ce7;
            margin-bottom: 15px;
            font-size: 1.2rem;
            position: relative;
            padding-bottom: 8px;
        }

        .card h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #4a4a4a;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.9rem;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #a29bfe;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(162, 155, 254, 0.2);
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
        }

        .students-list {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .student-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f1 100%);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #6c5ce7;
            transition: all 0.3s ease;
        }

        .student-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
        }

        .student-card h3 {
            color: #333;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .student-card p {
            color: #666;
            margin: 2px 0;
            font-size: 0.85rem;
        }

        .student-actions {
            margin-top: 8px;
            display: flex;
            gap: 6px;
        }

        .btn-small {
            padding: 4px 12px;
            font-size: 0.75rem;
            border-radius: 8px;
        }

        .btn-introduce {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        }

        .btn-course {
            background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
        }

        .btn-delete {
            background: linear-gradient(135deg, #e74c3c 0%, #fd79a8 100%);
        }

        .stats-mini {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .stats-mini .number {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .stats-mini div:first-child {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .study-timer {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%);
            border-radius: 15px;
            margin-top: 15px;
        }

        .study-timer h3 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .timer-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timer-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .alert-success {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        }

        .alert-info {
            background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #a29bfe;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Student Management Dashboard</h1>
            <div class="live-clock">
                <div class="time" id="clock">00:00:00</div>
                <div class="date" id="date">Loading...</div>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h2>✨ Add Student</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter student name" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" min="1" max="100" placeholder="Age" required>
                    </div>
                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" required>
                            <option value="">Select Course</option>
                            <option value="Computer Science">💻 Computer Science</option>
                            <option value="Business Administration">📊 Business</option>
                            <option value="Engineering">⚙️ Engineering</option>
                            <option value="Mathematics">🔢 Mathematics</option>
                            <option value="Physics">⚛️ Physics</option>
                            <option value="Chemistry">🧪 Chemistry</option>
                            <option value="Biology">🧬 Biology</option>
                            <option value="Literature">📚 Literature</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Add Student</button>
                </form>

                <div class="study-timer">
                    <h3>⏰ Study Timer</h3>
                    <div class="timer-display" id="timer">25:00</div>
                    <div class="timer-controls">
                        <button class="timer-btn" id="startTimer">Start</button>
                        <button class="timer-btn" id="resetTimer">Reset</button>
                        <button class="timer-btn" id="pauseTimer">Pause</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Students</h2>
                <div class="stats-mini">
                    <div>Total Students</div>
                    <div class="number" id="totalStudents">0</div>
                </div>
                
                <h2>📋 Student List</h2>
                <div class="students-list" id="studentsList">
                    <p style="color: #999; text-align: center; font-size: 0.9rem;">No students yet ✨</p>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
